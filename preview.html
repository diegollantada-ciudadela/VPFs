<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPFs - Gestion de Autorizados</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 24px;position:sticky;top:0;z-index:40}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;cursor:pointer}
.logo-icon{width:32px;height:32px;background:#1e40af;border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:14px}
.user-info{display:flex;align-items:center;gap:12px;color:#94a3b8;font-size:14px}
.btn-logout{color:#94a3b8;cursor:pointer;background:none;border:none;font-size:14px}
.btn-logout:hover{color:#1e293b}
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.login-card{width:100%;max-width:420px}
.login-header{text-align:center;margin-bottom:32px}
.login-icon{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:16px;background:#1e40af;margin-bottom:16px;color:white;font-size:28px}
.login-header h1{font-size:24px;font-weight:700}
.login-header p{color:#94a3b8;margin-top:8px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.08);border:1px solid #e2e8f0;padding:32px}
.card h2{font-size:18px;font-weight:600;margin-bottom:4px}
.card .sub{font-size:14px;color:#94a3b8;margin-bottom:24px}
label{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
input[type=text]{width:100%;padding:12px 16px;border-radius:8px;border:1px solid #e2e8f0;font-size:15px;outline:none;background:#f8fafc}
input[type=text]:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.15)}
.dropdown{position:absolute;width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.12);max-height:240px;overflow-y:auto;z-index:50;margin-top:4px}
.dropdown-item{padding:12px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid #f1f5f9}
.dropdown-item:hover{background:#eff6ff}
.dropdown-item:last-child{border-bottom:none}
.selected-badge{margin:16px 0;padding:12px;border-radius:8px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;font-size:14px;display:flex;align-items:center;gap:8px}
.btn-primary{width:100%;padding:12px;border-radius:8px;background:#1e40af;color:white;font-size:15px;font-weight:500;border:none;cursor:pointer}
.btn-primary:hover{background:#1e3a8a}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.main{max-width:1200px;margin:0 auto;padding:32px 24px}
.welcome h1{font-size:24px;font-weight:700;margin-bottom:4px}
.welcome p{color:#94a3b8;margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px}
.stat-value{font-size:28px;font-weight:700}
.green{color:#16a34a}.blue{color:#2563eb}.amber{color:#f59e0b}
.stat-label{font-size:13px;color:#94a3b8;margin-top:2px}
.stat-sub{font-size:14px;font-weight:400;color:#94a3b8}
.community{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;margin-bottom:20px}
.community-header{padding:16px 24px;border-bottom:1px solid #e2e8f0;background:#fafafa;display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px}
.community-name{font-weight:600;font-size:15px}
.community-meta{display:flex;gap:16px;margin-top:4px;flex-wrap:wrap}
.community-meta span{font-size:12px;color:#94a3b8}
.mono{font-family:monospace}
.badge-active{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:#dcfce7;color:#16a34a;font-size:12px;font-weight:500}
.badge-active .dot{width:6px;height:6px;border-radius:50%;background:#16a34a}
table{width:100%;font-size:14px;border-collapse:collapse}
thead{text-transform:uppercase;font-size:11px;color:#94a3b8;letter-spacing:0.05em}
th{padding:10px 24px;text-align:left;font-weight:500}
td{padding:12px 24px;border-top:1px solid #e2e8f0}
tr:hover{background:#fafafa}
.banco-cell{display:flex;align-items:center;gap:10px}
.banco-logo{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:700;flex-shrink:0}
.iban{font-family:monospace;font-size:12px;color:#475569}
.acceso{display:inline-flex;align-items:center;gap:4px;font-size:13px}
.acceso-si{color:#16a34a}.acceso-no{color:#dc2626}.acceso-pend{color:#f59e0b}
.estado{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid}
.estado-completado{background:#dcfce7;color:#16a34a;border-color:#bbf7d0}
.estado-en-tramite{background:#dbeafe;color:#2563eb;border-color:#bfdbfe}
.estado-pendiente{background:#fef3c7;color:#f59e0b;border-color:#fde68a}
.estado-no-iniciado{background:#f1f5f9;color:#64748b;border-color:#e2e8f0}
.btn-tramitar{padding:6px 14px;font-size:12px;font-weight:500;border-radius:8px;border:none;cursor:pointer}
.btn-tramitar-primary{background:#1e40af;color:white}
.btn-tramitar-primary:hover{background:#1e3a8a}
.btn-tramitar-done{color:#94a3b8;font-style:italic;background:none;cursor:default}
.text-right{text-align:right}
.hidden{display:none}
@media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}.community-header{flex-direction:column}table{font-size:12px}th,td{padding:8px 12px}}
</style>
</head>

let selectedAdmin = null;
const searchEl = document.getElementById('search');
const dropdownEl = document.getElementById('dropdown');
const selectedEl = document.getElementById('selected');
const btnEl = document.getElementById('btn-enter');

searchEl.addEventListener('input', function() {
  const q = this.value.toLowerCase();
  selectedAdmin = null;
  selectedEl.classList.add('hidden');
  btnEl.disabled = true;
  if (q.length < 2) { dropdownEl.classList.add('hidden'); return; }
  const matches = ADMINS.filter(a => a.nombre.toLowerCase().includes(q)).slice(0, 10);
  if (matches.length === 0) { dropdownEl.classList.add('hidden'); return; }
  dropdownEl.innerHTML = matches.map(a =>
    '<div class="dropdown-item" onclick="selectAdmin(' + a.id + ',\'' + a.nombre.replace(/'/g,"\\'") + '\')">' + a.nombre + '</div>'
  ).join('');
  dropdownEl.classList.remove('hidden');
});

searchEl.addEventListener('focus', function() {
  if (this.value.length >= 2) this.dispatchEvent(new Event('input'));
});

document.addEventListener('click', function(e) {
  if (!e.target.closest('#search') && !e.target.closest('#dropdown')) dropdownEl.classList.add('hidden');
});

function selectAdmin(id, name) {
  selectedAdmin = {id, nombre: name};
  searchEl.value = name;
  dropdownEl.classList.add('hidden');
  selectedEl.innerHTML = '&#10004; ' + name;
  selectedEl.classList.remove('hidden');
  btnEl.disabled = false;
}

function bancoColor(b) {
  const l = b.toLowerCase();
  if (l.includes('sabadell')) return '#dc2626';
  if (l.includes('caixa') && !l.includes('guissona') && !l.includes('popular')) return '#0284c7';
  if (l.includes('bbva')) return '#1d4ed8';
  if (l.includes('bankinter')) return '#ea580c';
  if (l.includes('ibercaja')) return '#7c3aed';
  if (l.includes('cajamar')) return '#059669';
  if (l.includes('santander')) return '#dc2626';
  if (l.includes('unicaja')) return '#4f46e5';
  if (l.includes('globalcaja') || l.includes('caja rural') || l.includes('eurocaja')) return '#16a34a';
  return '#6b7280';
}

function bancoInitials(b) { return b.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }

function estadoClass(e) {
  if (e==='Completado') return 'estado-completado';
  if (e==='En tramite'||e==='En trámite') return 'estado-en-tramite';
  if (e==='Pendiente') return 'estado-pendiente';
  return 'estado-no-iniciado';
}

function accesoClass(a) {
  if (a==='Si'||a==='Sí') return 'acceso-si';
  if (a==='No') return 'acceso-no';
  return 'acceso-pend';
}

function enterDashboard() {
  if (!selectedAdmin) return;
  const admin = DATA[selectedAdmin.id];
  if (!admin) { alert('Admin no encontrado'); return; }
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('dashboard-view').classList.remove('hidden');
  document.getElementById('dash-user').textContent = admin.nombre;

  const tc = admin.comunidades.reduce((a,c) => a + c.cuentas.length, 0);
  const comp = admin.comunidades.reduce((a,c) => a + c.cuentas.filter(ct=>ct.estadoVPF==='Completado').length, 0);
  const tram = admin.comunidades.reduce((a,c) => a + c.cuentas.filter(ct=>ct.estadoVPF==='En trámite').length, 0);
  const pend = tc - comp - tram;

  let html = '<div class="welcome"><h1>Hola, ' + admin.nombre.split(' ')[0] + '</h1><p>Gestiona los cambios de autorizados de tus comunidades</p></div>';
  html += '<div class="stats">';
  html += '<div class="stat"><div class="stat-value">' + admin.comunidades.length + '</div><div class="stat-label">Comunidades</div></div>';
  html += '<div class="stat"><div class="stat-value green">' + comp + '<span class="stat-sub">/' + tc + '</span></div><div class="stat-label">VPFs completados</div></div>';
  html += '<div class="stat"><div class="stat-value blue">' + tram + '</div><div class="stat-label">En tramite</div></div>';
  html += '<div class="stat"><div class="stat-value amber">' + pend + '</div><div class="stat-label">Pendientes</div></div>';
  html += '</div>';

  admin.comunidades.forEach(c => {
    html += '<div class="community"><div class="community-header"><div><div class="community-name">' + c.nombre + '</div>';
    html += '<div class="community-meta"><span>CIF: <span class="mono">' + c.cif + '</span></span><span>' + c.direccion + '</span></div></div>';
    html += '<span class="badge-active"><span class="dot"></span>Activa</span></div>';
    if (c.cuentas.length > 0) {
      html += '<table><thead><tr><th>Banco</th><th>IBAN</th><th>Acceso</th><th>Estado VPF</th><th class="text-right">Accion</th></tr></thead><tbody>';
      c.cuentas.forEach(ct => {
        const color = bancoColor(ct.banco);
        const initials = bancoInitials(ct.banco);
        const ec = estadoClass(ct.estadoVPF);
        const ac = accesoClass(ct.accesoBanco);
        const btnData = JSON.stringify({community: c.nombre, cif: c.cif, direccion: c.direccion, iban: ct.iban, banco: ct.banco}).replace(/'/g,'&#39;').replace(/"/g,'&quot;');
        let btn = ct.estadoVPF === 'Completado'
          ? '<span class="btn-tramitar btn-tramitar-done">Completado</span>'
          : '<button class="btn-tramitar btn-tramitar-primary" onclick="openWizard(&quot;' + encodeURIComponent(JSON.stringify({community: c.nombre, cif: c.cif, direccion: c.direccion, iban: ct.iban, banco: ct.banco})) + '&quot;)">Tramitar VPF</button>';
        html += '<tr><td><div class="banco-cell"><span class="banco-logo" style="background:' + color + '">' + initials + '</span>' + ct.banco + '</div></td>';
        html += '<td><span class="iban">' + ct.iban + '</span></td>';
        html += '<td><span class="acceso ' + ac + '">' + ct.accesoBanco + '</span></td>';
        html += '<td><span class="estado ' + ec + '">' + ct.estadoVPF + '</span></td>';
        html += '<td class="text-right">' + btn + '</td></tr>';
      });
      html += '</tbody></table>';
    } else {
      html += '<div style="padding:16px 24px;color:#94a3b8;font-size:14px">Sin cuentas bancarias registradas</div>';
    }
    html += '</div>';
  });

  document.getElementById('dash-content').innerHTML = html;
  window.scrollTo(0,0);
}

function goBack() {
  document.getElementById('dashboard-view').classList.add('hidden');
  document.getElementById('login-view').classList.remove('hidden');
  selectedAdmin = null;
  searchEl.value = '';
  selectedEl.classList.add('hidden');
  btnEl.disabled = true;
}

let wizardStep = 1;
let wizardData = {};
let wizardAutorizados = [];

function openWizard(encodedData) {
  const data = JSON.parse(decodeURIComponent(encodedData));
  wizardData = data;
  wizardStep = 1;

  const isSabadell = data.banco.toLowerCase().includes('sabadell');

  if (!isSabadell) {
    document.getElementById('wizard-overlay').innerHTML = '<div class="wiz-modal" style="max-width:480px"><div class="wiz-header"><h2>Proceso no disponible</h2><button class="wiz-close" onclick="closeWizard()">&times;</button></div><div style="padding:32px;text-align:center"><div style="font-size:48px;margin-bottom:16px">🏗️</div><p style="font-size:16px;color:#1e293b;margin-bottom:8px">El proceso de tramitación para <strong>' + data.banco + '</strong> no está disponible todavía.</p><p style="color:#94a3b8;font-size:14px">Próximamente se habilitará el flujo para este banco.</p><button onclick="closeWizard()" style="margin-top:24px;padding:10px 24px;background:#1e40af;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px">Entendido</button></div></div>';
    document.getElementById('wizard-overlay').classList.remove('hidden');
    return;
  }

  // Mock autorizados for the demo
  wizardAutorizados = [
    {nombre: 'María García López', dni: '51234567A', cargo: 'Presidente', tipo: 'ALTA'},
    {nombre: 'Juan Pérez Ruiz', dni: '48765432B', cargo: 'Vicepresidente', tipo: 'ALTA'},
    {nombre: 'Carlos Fernández Martín', dni: '09876543C', cargo: 'Presidente anterior', tipo: 'BAJA'}
  ];

  renderWizard();
  document.getElementById('wizard-overlay').classList.remove('hidden');
}

function closeWizard() {
  document.getElementById('wizard-overlay').classList.add('hidden');
}

function nextStep() {
  if (wizardStep < 4) { wizardStep++; renderWizard(); }
}

function prevStep() {
  if (wizardStep > 1) { wizardStep--; renderWizard(); }
}

function renderWizard() {
  const d = wizardData;
  const steps = ['Obtener Acta', 'Autorizados', 'Formulario PEC52', 'Envío'];

  let progressHtml = '<div class="wiz-progress">';
  steps.forEach((s, i) => {
    const n = i + 1;
    const cls = n < wizardStep ? 'done' : n === wizardStep ? 'active' : '';
    progressHtml += '<div class="wiz-step ' + cls + '"><div class="wiz-step-num">' + (n < wizardStep ? '✓' : n) + '</div><div class="wiz-step-label">' + s + '</div></div>';
    if (i < 3) progressHtml += '<div class="wiz-step-line ' + (n < wizardStep ? 'done' : '') + '"></div>';
  });
  progressHtml += '</div>';

  let communityInfo = '<div class="wiz-community"><strong>' + d.community + '</strong><span>CIF: ' + d.cif + '</span><span>' + d.banco + ' · ' + d.iban + '</span></div>';

  let content = '';
  let footer = '';

  if (wizardStep === 1) {
    content = '<div class="wiz-section"><h3>📋 Última Junta Ordinaria</h3><div class="wiz-card"><div class="wiz-row"><span class="wiz-label">Tipo:</span><span>Junta General Ordinaria</span></div><div class="wiz-row"><span class="wiz-label">Fecha:</span><span>15 de marzo de 2026</span></div><div class="wiz-row"><span class="wiz-label">Estado:</span><span style="color:#16a34a">✓ Celebrada</span></div></div><h3 style="margin-top:20px">📄 Resumen del Acta</h3><div class="wiz-card" style="background:#f8fafc"><p style="font-size:13px;line-height:1.7;color:#475569">Se aprobaron las cuentas del ejercicio anterior. Se ratificó el presupuesto para el año en curso manteniendo las cuotas actuales. <strong>Se eligieron los nuevos cargos de la comunidad</strong>: Presidente/a y Vicepresidente/a. Se aprobó mantener la administración actual (Ciudadela Property Management S.L.).</p></div><div class="wiz-info">ℹ️ El acta se obtiene automáticamente de Ciudadela. Confirma que la información es correcta antes de continuar.</div></div>';
    footer = '<div class="wiz-footer"><button class="wiz-btn-secondary" onclick="closeWizard()">Cancelar</button><button class="wiz-btn-primary" onclick="nextStep()">Confirmar Acta →</button></div>';
  }

  else if (wizardStep === 2) {
    let rows = '';
    wizardAutorizados.forEach((a, i) => {
      const color = a.tipo === 'ALTA' ? '#16a34a' : '#dc2626';
      const bg = a.tipo === 'ALTA' ? '#dcfce7' : '#fef2f2';
      rows += '<div class="wiz-auth-row"><div class="wiz-auth-badge" style="background:' + bg + ';color:' + color + '">' + a.tipo + '</div><div class="wiz-auth-fields"><div><label>Nombre completo</label><input type="text" value="' + a.nombre + '" onchange="wizardAutorizados[' + i + '].nombre=this.value" class="wiz-input"></div><div><label>DNI/NIF</label><input type="text" value="' + a.dni + '" onchange="wizardAutorizados[' + i + '].dni=this.value" class="wiz-input" style="width:140px"></div><div><label>Cargo</label><input type="text" value="' + a.cargo + '" onchange="wizardAutorizados[' + i + '].cargo=this.value" class="wiz-input" style="width:160px"></div><button class="wiz-btn-remove" onclick="wizardAutorizados.splice(' + i + ',1);renderWizard()">✕</button></div></div>';
    });
    content = '<div class="wiz-section"><h3>👥 Personas Autorizadas</h3><p style="color:#94a3b8;font-size:13px;margin-bottom:16px">Extraídas del acta de la junta. Edita si es necesario.</p>' + rows + '<div style="display:flex;gap:8px;margin-top:12px"><button class="wiz-btn-add" onclick="wizardAutorizados.push({nombre:String(),dni:String(),cargo:String(),tipo:String('ALTA')});renderWizard()">+ Añadir Alta</button><button class="wiz-btn-add" style="background:#fef2f2;color:#dc2626;border-color:#fecaca" onclick="wizardAutorizados.push({nombre:String(),dni:String(),cargo:String(),tipo:String('BAJA')});renderWizard()">+ Añadir Baja</button></div><div class="wiz-info" style="margin-top:16px">⚠️ Asegúrate de que los DNIs son correctos. Sabadell rechazará la solicitud si hay errores.</div></div>';
    footer = '<div class="wiz-footer"><button class="wiz-btn-secondary" onclick="prevStep()">← Volver</button><button class="wiz-btn-primary" onclick="nextStep()">Confirmar Autorizados →</button></div>';
  }

  else if (wizardStep === 3) {
    let altas = wizardAutorizados.filter(a => a.tipo === 'ALTA').map(a => '<tr><td>' + a.nombre + '</td><td>' + a.dni + '</td><td>' + a.cargo + '</td></tr>').join('');
    let bajas = wizardAutorizados.filter(a => a.tipo === 'BAJA').map(a => '<tr><td>' + a.nombre + '</td><td>' + a.dni + '</td><td>' + a.cargo + '</td></tr>').join('');
    content = '<div class="wiz-section"><h3>📝 Formulario PEC52 - Banco Sabadell</h3><div class="wiz-pec52"><div class="pec-header">SOLICITUD DE MODIFICACIÓN DE AUTORIZADOS<br><span style="font-size:12px;color:#64748b">Comunidad de Propietarios - Banco Sabadell</span></div><div class="pec-section"><div class="pec-title">DATOS DE LA COMUNIDAD</div><div class="pec-grid"><div><span class="pec-label">Nombre:</span> ' + d.community + '</div><div><span class="pec-label">CIF:</span> ' + d.cif + '</div><div><span class="pec-label">Dirección:</span> ' + d.direccion + '</div><div><span class="pec-label">IBAN:</span> ' + d.iban + '</div></div></div><div class="pec-section"><div class="pec-title">ADMINISTRADOR</div><div class="pec-grid"><div><span class="pec-label">Nombre:</span> Ciudadela Property Management S.L.</div><div><span class="pec-label">CIF:</span> B21835871</div></div></div>' + (altas ? '<div class="pec-section"><div class="pec-title" style="color:#16a34a">ALTAS DE AUTORIZADOS</div><table class="pec-table"><thead><tr><th>Nombre</th><th>DNI</th><th>Cargo</th></tr></thead><tbody>' + altas + '</tbody></table><p style="font-size:11px;color:#94a3b8;margin-top:8px">* Cada persona dada de alta deberá firmar con certificado digital o acudir presencialmente a una sucursal de Banco Sabadell</p></div>' : '') + (bajas ? '<div class="pec-section"><div class="pec-title" style="color:#dc2626">BAJAS DE AUTORIZADOS</div><table class="pec-table"><thead><tr><th>Nombre</th><th>DNI</th><th>Cargo</th></tr></thead><tbody>' + bajas + '</tbody></table></div>' : '') + '<div class="pec-section"><div class="pec-title">FECHA</div><div>' + new Date().toLocaleDateString("es-ES") + '</div></div></div></div>';
    footer = '<div class="wiz-footer"><button class="wiz-btn-secondary" onclick="prevStep()">← Volver</button><button class="wiz-btn-primary" onclick="nextStep()">Confirmar Formulario →</button></div>';
  }

  else if (wizardStep === 4) {
    content = '<div class="wiz-section wiz-send"><h3>📧 Envío de documentación</h3><div class="wiz-card"><div class="wiz-row"><span class="wiz-label">Destinatario:</span><span style="font-family:monospace;font-size:13px">GestionCuentaComunidadPropietarios@bancsabadell.com</span></div><div class="wiz-row"><span class="wiz-label">CC:</span><span style="font-family:monospace;font-size:13px">gestionbancos@ciudadela.eu</span></div><div class="wiz-row"><span class="wiz-label">Asunto:</span><span>' + d.cif + ' - Solicitud modificación autorizados</span></div></div><h4 style="margin-top:20px;margin-bottom:12px">📎 Documentos adjuntos</h4><div class="wiz-attachments"><div class="wiz-attach">📄 Formulario PEC52 - ' + d.community + '.pdf</div><div class="wiz-attach">📄 Acta Junta Ordinaria - ' + d.community + '.pdf</div><div class="wiz-attach">📄 Copia DNI autorizados.pdf</div></div><div class="wiz-info" style="margin-top:20px">✅ Todo listo para enviar. Revisa la información antes de confirmar.</div></div>';
    footer = '<div class="wiz-footer"><button class="wiz-btn-secondary" onclick="prevStep()">← Volver</button><button class="wiz-btn-primary" style="background:#16a34a" onclick="sendVPF()">✓ Enviar Tramitación</button></div>';
  }

  document.getElementById('wizard-overlay').innerHTML = '<div class="wiz-modal">' +
    '<div class="wiz-header"><h2>Tramitar VPF</h2><button class="wiz-close" onclick="closeWizard()">&times;</button></div>' +
    progressHtml + communityInfo + content + footer + '</div>';
}

function sendVPF() {
  document.getElementById('wizard-overlay').innerHTML = '<div class="wiz-modal" style="max-width:480px"><div style="padding:48px;text-align:center"><div style="font-size:64px;margin-bottom:16px">✅</div><h2 style="margin-bottom:8px">Tramitación enviada</h2><p style="color:#94a3b8;margin-bottom:8px">La solicitud de cambio de autorizados para</p><p style="font-weight:600;margin-bottom:4px">' + wizardData.community + '</p><p style="color:#94a3b8;font-size:13px;margin-bottom:24px">se ha enviado correctamente a Banco Sabadell</p><div class="wiz-card" style="text-align:left;margin-bottom:24px"><div class="wiz-row"><span class="wiz-label">Estado:</span><span style="color:#2563eb">En trámite</span></div><div class="wiz-row"><span class="wiz-label">Enviado a:</span><span style="font-size:12px">GestionCuentaComunidadPropietarios@bancsabadell.com</span></div><div class="wiz-row"><span class="wiz-label">Fecha:</span><span>' + new Date().toLocaleDateString("es-ES") + '</span></div></div><button onclick="closeWizard()" style="padding:12px 32px;background:#1e40af;color:white;border:none;border-radius:8px;cursor:pointer;font-size:15px">Volver al Dashboard</button></div></div>';
}
</script>
